# Render (and similar hosts) tell the app which port to use in PORT.
server.port=${PORT:8080}
# The driver is picked from the URL: jdbc:h2:... locally, jdbc:postgresql:... on Render/Neon.
spring.datasource.url=${DATABASE_URL:jdbc:h2:file:./data/wargames}
spring.datasource.username=${DATABASE_USERNAME:sa}
spring.datasource.password=${DATABASE_PASSWORD:}
# Small pool: free Postgres plans allow few connections and the free server has 512 MB.
spring.datasource.hikari.maximum-pool-size=${DATABASE_POOL_SIZE:5}
spring.jpa.hibernate.ddl-auto=update
# Load terrain stroke points in a few batched queries instead of one per stroke (each
# movement preview reads every stroke; over a network database that adds up fast).
spring.jpa.properties.hibernate.default_batch_fetch_size=500
spring.jpa.properties.hibernate.jdbc.batch_size=200
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
map-editor.token=${MAP_EDITOR_TOKEN:}
# Static files (scripts, styles, map art): cache for a day, then fetch again. Jar entries all
# carry a fixed 1980 timestamp, so Last-Modified can't tell versions apart; it is turned off.
# The page itself is never cached (PageCacheHeaders).
spring.web.resources.cache.cachecontrol.max-age=1d
spring.web.resources.cache.use-last-modified=false
server.error.include-message=always
