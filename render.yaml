# Render Blueprint: one free web service built from the Dockerfile.
# Saved games live in a free Neon Postgres database, because Render's free
# instances lose local files whenever they restart or go to sleep.
services:
  - type: web
    name: wargames
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /
    autoDeploy: true
    envVars:
      # From Neon's connection details, e.g.
      # jdbc:postgresql://ep-xxx.us-east-2.aws.neon.tech/neondb?sslmode=require
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_USERNAME
        sync: false
      - key: DATABASE_PASSWORD
        sync: false
      # Turns on map editing and terrain import (scripts/import-terrain.ps1).
      # Render generates a random value; copy it from the service's Environment page.
      - key: MAP_EDITOR_TOKEN
        generateValue: true
